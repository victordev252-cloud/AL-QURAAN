name: Quran Karim APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Quran Karim
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          echo "Using Android SDK: $SDK_ROOT"

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          else
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          echo "SDK Manager: $SDKMANAGER"
          echo "SDKMANAGER_PATH=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set -e
          yes | "$SDKMANAGER_PATH" \
            --sdk_root="$ANDROID_HOME" \
            --licenses || true

      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -e

          "$SDKMANAGER_PATH" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Gradle Wrapper
        shell: bash
        run: |
          if [ ! -f gradlew ]; then
            echo "ERROR: gradlew is missing from the repository root."
            exit 1
          fi

          chmod +x gradlew
          ./gradlew --version

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quran-Karim-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
