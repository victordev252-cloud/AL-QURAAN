name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Quran Karim APK
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK Command-line Tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y unzip wget

          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
            -O /tmp/android-cmdline-tools.zip

          unzip -q /tmp/android-cmdline-tools.zip -d /tmp/android-tools

          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          cp -a /tmp/android-tools/cmdline-tools/. \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/"

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Accept licenses and install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses || true

          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Check project files
        run: |
          echo "Checking Android project..."

          test -f settings.gradle.kts || test -f settings.gradle

          test -f app/build.gradle.kts || test -f app/build.gradle

          if [ ! -f gradlew ]; then
            echo "ERROR: gradlew is missing from the repository root."
            exit 1
          fi

          ls -la

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Quran-Karim-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
